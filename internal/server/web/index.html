<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidWise MVP</title>
<style>
  :root { --bg:#0f1115; --panel:#191c22; --text:#e6e8eb; --muted:#8b919a; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 18px; border-bottom:1px solid #2a2e36; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .hint { color:var(--muted); font-size:12px; }
  #new { margin-left:auto; background:transparent; border:1px solid #2a2e36; color:var(--text); border-radius:6px; padding:5px 12px; cursor:pointer; }
  #new:hover { border-color:var(--accent); }
  main { flex:1; overflow-y:auto; padding:18px; }
  .msg { max-width:760px; margin:0 auto 12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { text-align:right; }
  .msg.user .bubble { display:inline-block; background:#233044; color:#fff; padding:9px 14px; border-radius:12px; text-align:left; }
  .msg.assistant .bubble { display:inline-block; background:var(--panel); padding:9px 14px; border-radius:12px; }
  .msg.err { color:#ff7b72; text-align:center; font-size:13px; }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
  footer { padding:12px 18px; border-top:1px solid #2a2e36; }
  form { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; background:var(--panel); border:1px solid #2a2e36; color:var(--text); border-radius:8px; padding:9px 12px; font:inherit; min-height:40px; max-height:200px; }
  button[type=submit] { background:var(--accent); border:none; color:#fff; border-radius:8px; padding:0 18px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>VidWise</h1>
  <span class="hint">发视频链接即可入库，之后可问答</span>
  <button id="new">新对话</button>
</header>
<main id="chat"></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="粘贴视频链接，或输入问题…"></textarea>
    <button type="submit">发送</button>
  </form>
</footer>
<script>
(function () {
  var chat = document.getElementById('chat');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = form.querySelector('button');
  var sessionId = localStorage.getItem('vidwise.session') || '';

  function bubble(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    div.appendChild(b);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showEmpty() {
    if (!chat.children.length) {
      chat.innerHTML = '<div class="empty">发送一个视频链接开始（例如 https://…），处理完成后我会告知你内容概要。</div>';
    }
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    input.disabled = busy;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var message = input.value.trim();
    if (!message) return;
    bubble('user', message);
    input.value = '';
    setBusy(true);
    fetch('/agent/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: message})
    }).then(function (resp) {
      return resp.text().then(function (text) {
        return {ok: resp.ok, text: text};
      });
    }).then(function (res) {
      if (res.ok) {
        var data = JSON.parse(res.text);
        sessionId = data.session_id;
        localStorage.setItem('vidwise.session', sessionId);
        bubble('assistant', data.reply);
      } else {
        var msg = '出错了，请重试';
        try { msg = JSON.parse(res.text).error || msg; } catch (e) {}
        bubble('err', msg);
      }
    }).catch(function (err) {
      bubble('err', '网络错误: ' + err.message);
    }).finally(function () {
      setBusy(false);
      input.focus();
    });
  });

  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      form.dispatchEvent(new Event('submit'));
    }
  });

  document.getElementById('new').addEventListener('click', function () {
    sessionId = '';
    localStorage.removeItem('vidwise.session');
    chat.innerHTML = '';
    showEmpty();
    input.focus();
  });

  showEmpty();
})();
</script>
</body>
</html>
