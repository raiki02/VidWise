<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VidWise</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101014;
      --surface: #18181d;
      --surface-2: #202027;
      --line: #30303a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --soft: #71717a;
      --accent: #2dd4bf;
      --accent-2: #38bdf8;
      --warning: #f59e0b;
      --danger: #f87171;
      --ok: #22c55e;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 288px minmax(0, 1fr);
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #042f2e; font-weight: 700; }
    button.danger { border-color: rgba(248, 113, 113, .5); color: #fecaca; }
    button.ghost { background: transparent; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #111116;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 10px;
      min-height: 38px;
    }
    textarea { resize: vertical; line-height: 1.5; }
    label { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    aside {
      min-height: 100vh;
      background: #151519;
      border-right: 1px solid var(--line);
      padding: 16px;
      overflow-y: auto;
    }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .brand h1 { font-size: 18px; margin: 0; letter-spacing: 0; }
    .health-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); display: inline-block; }
    .health-dot.ok { background: var(--ok); }
    .health-dot.warn { background: var(--warning); }
    .health-dot.err { background: var(--danger); }
    nav { display: grid; gap: 4px; margin-bottom: 16px; }
    .nav-item {
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      border-radius: 8px;
      min-height: 38px;
      padding: 0 10px;
    }
    .nav-item.active { background: var(--surface-2); color: var(--text); }
    .side-section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; display: grid; gap: 10px; }
    .side-title { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row > * { min-width: 0; }
    .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.ok { color: #bbf7d0; border-color: rgba(34, 197, 94, .45); }
    .pill.warn { color: #fde68a; border-color: rgba(245, 158, 11, .45); }
    .pill.err { color: #fecaca; border-color: rgba(248, 113, 113, .45); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #111116;
      color: var(--muted);
      padding: 2px 8px;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
    }
    button.chip { cursor: pointer; }
    button.chip.active { color: #bbf7d0; border-color: rgba(34, 197, 94, .45); }
    .source-picker { display: grid; gap: 8px; max-height: 280px; overflow: auto; }
    .source-option {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      margin: 0;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111116;
      color: var(--text);
      font-size: 13px;
    }
    .source-option input { width: 16px; min-height: 16px; margin-top: 2px; }
    .source-title { font-weight: 700; overflow-wrap: anywhere; }
    .source-meta { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 3px; overflow-wrap: anywhere; }
    .source-cell { min-width: 220px; }
    .metadata-cell { min-width: 280px; }
    .advanced-filter { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .advanced-filter summary { color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 700; }
    .advanced-filter summary::marker { color: var(--soft); }
    .main {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(16, 16, 20, .96);
    }
    header h2 { margin: 0; font-size: 16px; }
    .header-meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .workspace { min-height: 0; overflow: hidden; }
    .tab {
      height: 100%;
      display: none;
      min-height: 0;
      overflow: auto;
      padding: 20px;
    }
    .tab.active { display: block; }
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, .8fr); gap: 16px; align-items: start; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .panel h3 { margin: 0 0 14px; font-size: 15px; }
    .panel + .panel { margin-top: 16px; }
    .form-grid { display: grid; gap: 14px; }
    .status-box {
      background: #111116;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 40px;
      padding: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    #messages {
      height: calc(100vh - 174px);
      min-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: min(860px, 92%);
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user { align-self: flex-end; background: #12313a; border-color: rgba(45, 212, 191, .35); }
    .message.assistant { align-self: flex-start; background: var(--surface); }
    .message .meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    details { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
    summary { cursor: pointer; color: var(--muted); font-weight: 700; }
    .chunk {
      margin-top: 8px;
      padding: 8px;
      background: #111116;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
      color: #d4d4d8;
      line-height: 1.5;
    }
    .chat-input {
      border-top: 1px solid var(--line);
      margin-top: 12px;
      padding-top: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th, .table td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
    .table th { color: var(--muted); font-size: 12px; }
    .id { color: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .task { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #111116; }
    .steps { display: grid; gap: 6px; margin-top: 8px; }
    .step { display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; overflow: auto; }
      aside { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .main { min-height: auto; }
      .grid-2 { grid-template-columns: 1fr; }
      #messages { height: 52vh; }
      .chat-input { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>VidWise</h1>
      <span id="ready-dot" class="health-dot"></span>
    </div>
    <nav>
      <button class="nav-item active" data-nav="chat" type="button">Agent 问答</button>
      <button class="nav-item" data-nav="video" type="button">视频任务</button>
      <button class="nav-item" data-nav="sources" type="button">知识库</button>
      <button class="nav-item" data-nav="upload" type="button">上传索引</button>
      <button class="nav-item" data-nav="format" type="button">文本格式化</button>
      <button class="nav-item" data-nav="tasks" type="button">任务列表</button>
    </nav>

    <section class="side-section">
      <div class="side-title">知识库范围</div>
      <div>
        <label for="scope-user">User ID</label>
        <input id="scope-user" autocomplete="off" placeholder="u1" />
      </div>
      <div>
        <label for="scope-session">Session ID</label>
        <input id="scope-session" autocomplete="off" placeholder="自动或手动填写" />
      </div>
      <div class="row">
        <button id="save-scope" class="primary" type="button">保存</button>
        <button id="new-session" type="button">新对话</button>
      </div>
    </section>

    <section class="side-section">
      <div class="side-title">Runtime</div>
      <div class="row"><span id="rag-dot" class="health-dot"></span><span id="rag-status" class="small muted">RAG 检测中</span></div>
      <div class="row"><span id="llm-dot" class="health-dot"></span><span id="llm-status" class="small muted">LLM 检测中</span></div>
      <button id="refresh-runtime" type="button">刷新状态</button>
    </section>

    <section class="side-section">
      <div class="side-title">Sessions</div>
      <div id="session-list" class="small muted"></div>
    </section>
  </aside>

  <main class="main">
    <header>
      <h2 id="page-title">Agent 问答</h2>
      <div class="header-meta">
        <span id="scope-pill" class="pill">知识库范围未保存</span>
        <span id="source-pill" class="pill">0 sources</span>
        <span id="task-pill" class="pill">0 tasks</span>
      </div>
    </header>

    <div class="workspace">
      <section id="tab-chat" class="tab active">
        <div class="grid-2">
          <div class="panel">
            <div id="messages">
              <div class="message assistant">RAG Agent 已就绪。</div>
            </div>
            <div class="chat-input">
              <textarea id="chat-input" rows="2" placeholder="输入问题，Shift+Enter 换行"></textarea>
              <button id="send-chat" class="primary" type="button">发送</button>
            </div>
          </div>
          <div>
            <div class="panel">
              <h3>知识库范围</h3>
              <div id="selected-source-list" class="status-box">当前检索个人知识库中的全部 source。</div>
              <div id="chat-source-picker" class="source-picker" style="margin-top:12px;"></div>
              <details class="advanced-filter">
                <summary>高级 ID 过滤</summary>
                <div style="margin-top:12px;">
                  <label for="source-filter">Source IDs</label>
                  <input id="source-filter" placeholder="source-1, source-2" />
                </div>
                <div style="margin-top:12px;">
                  <label for="document-filter">Document IDs</label>
                  <input id="document-filter" placeholder="doc-1, doc-2" />
                </div>
              </details>
              <div class="row" style="margin-top:12px;">
                <button id="reload-chat-sources" type="button">刷新列表</button>
                <button id="clear-source-filter" type="button">清空选择</button>
              </div>
            </div>
            <div class="panel">
              <h3>最近一次回答</h3>
              <div id="rag-diagnostics" class="status-box">暂无 RAG 诊断。</div>
            </div>
          </div>
        </div>
      </section>

      <section id="tab-video" class="tab">
        <div class="grid-2">
          <form id="video-form" class="panel form-grid">
            <h3>异步视频处理</h3>
            <div>
              <label for="video-url">视频 URL</label>
              <input id="video-url" placeholder="https://example.com/video" />
            </div>
            <div class="split">
              <div>
                <label for="video-name">名称</label>
                <input id="video-name" placeholder="demo" />
              </div>
              <div>
                <label for="video-language">语言</label>
                <select id="video-language">
                  <option value="zh">zh</option>
                  <option value="en">en</option>
                  <option value="auto">auto</option>
                </select>
              </div>
            </div>
            <button class="primary" type="submit">启动任务</button>
            <div id="video-status" class="status-box"></div>
          </form>
          <form id="extract-form" class="panel form-grid">
            <h3>文件下载</h3>
            <div>
              <label for="extract-url">视频 URL</label>
              <input id="extract-url" placeholder="https://example.com/video" />
            </div>
            <div class="split">
              <div>
                <label for="extract-name">文件名</label>
                <input id="extract-name" placeholder="demo" />
              </div>
              <div>
                <label for="extract-type">下载类型</label>
                <select id="extract-type">
                  <option value="video">video (mp4)</option>
                  <option value="audio">audio (mp3)</option>
                  <option value="text">text (txt)</option>
                  <option value="summary">summary (txt)</option>
                </select>
              </div>
            </div>
            <button type="submit">下载文件</button>
            <div id="extract-status" class="status-box"></div>
          </form>
          <div class="panel">
            <h3>当前任务</h3>
            <div id="active-task" class="status-box">暂无任务。</div>
          </div>
        </div>
      </section>

      <section id="tab-sources" class="tab">
        <div class="panel">
          <div class="row" style="justify-content:space-between;margin-bottom:12px;">
            <h3 style="margin:0;">知识库 Sources</h3>
            <button id="reload-sources" type="button">刷新</button>
          </div>
          <div id="source-status" class="status-box" style="margin-bottom:12px;"></div>
          <div style="overflow:auto;">
            <table class="table">
              <thead>
                <tr>
                  <th>选择</th>
                  <th>Source</th>
                  <th>类型</th>
                  <th>Metadata</th>
                  <th>Chunks</th>
                  <th>Scope</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="source-table"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="tab-upload" class="tab">
        <form id="upload-form" class="panel form-grid">
          <h3>上传并索引</h3>
          <div>
            <label for="upload-file">文本或 Markdown 文件</label>
            <input id="upload-file" type="file" accept=".txt,.md,.markdown,.srt,.csv,text/plain,text/markdown,text/csv" />
          </div>
          <button class="primary" type="submit">上传</button>
          <div id="upload-status" class="status-box"></div>
        </form>
      </section>

      <section id="tab-format" class="tab">
        <form id="format-form" class="panel form-grid">
          <h3>文本格式化</h3>
          <div>
            <label for="format-file">文本或 Markdown 文件</label>
            <input id="format-file" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" />
          </div>
          <button class="primary" type="submit">格式化并下载</button>
          <div id="format-status" class="status-box"></div>
        </form>
      </section>

      <section id="tab-tasks" class="tab">
        <div class="panel">
          <div class="row" style="justify-content:space-between;margin-bottom:12px;">
            <h3 style="margin:0;">任务列表</h3>
            <button id="reload-tasks" type="button">刷新</button>
          </div>
          <div id="task-status" class="status-box" style="margin-bottom:12px;"></div>
          <div id="task-list"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const state = {
      tab: "chat",
      userId: localStorage.getItem("vidwise.user_id") || "u1",
      sessionId: localStorage.getItem("vidwise.session_id") || "",
      selectedSourceIds: new Set(JSON.parse(localStorage.getItem("vidwise.selected_source_ids") || "[]")),
      sources: [],
      activeTaskId: "",
      pollTimer: 0,
    };

    const titles = {
      chat: "Agent 问答",
      video: "视频任务",
      sources: "知识库",
      upload: "上传索引",
      format: "文本格式化",
      tasks: "任务列表",
    };

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    function esc(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function compactId(value) {
      value = String(value || "");
      return value.length > 18 ? value.slice(0, 8) + "..." + value.slice(-6) : value;
    }

    function normalizeList(values) {
      const out = [];
      const seen = new Set();
      values.forEach((value) => {
        value = String(value || "").trim();
        if (!value || seen.has(value)) return;
        out.push(value);
        seen.add(value);
      });
      return out;
    }

    function splitCSV(value) {
      return normalizeList(String(value || "").split(","));
    }

    function sourceValues(source, field) {
      return normalizeList(Array.isArray(source[field]) ? source[field] : []);
    }

    function sourceLabel(source) {
      return source.source_name || source.document_title || compactId(source.source_id) || "source";
    }

    function sourceMetaLine(source) {
      const parts = [];
      if (source.source_url) parts.push(source.source_url);
      if (source.document_title && source.document_title !== source.source_name) parts.push(source.document_title);
      parts.push(`${source.chunk_count || 0} chunks`);
      return parts.filter(Boolean).join(" | ");
    }

    function renderMetadataGroup(label, values, options = {}) {
      values = normalizeList(values);
      if (!values.length) return "";
      const limit = options.limit || 4;
      const shown = values.slice(0, limit);
      const activeDocs = options.document ? new Set(documentFilters()) : new Set();
      const chips = shown.map((value) => {
        const text = compactId(value);
        if (options.document) {
          const active = activeDocs.has(value) ? " active" : "";
          return `<button class="chip${active}" type="button" title="${esc(value)}" data-doc-filter="${esc(value)}">${esc(text)}</button>`;
        }
        return `<span class="chip" title="${esc(value)}">${esc(text)}</span>`;
      }).join("");
      const more = values.length > limit ? `<span class="chip">+${values.length - limit}</span>` : "";
      return `<div class="source-meta">${esc(label)}</div><div class="chip-list">${chips}${more}</div>`;
    }

    function renderSourceMetadata(source, compact = false) {
      const limit = compact ? 2 : 4;
      return [
        renderMetadataGroup("Document IDs", sourceValues(source, "document_ids"), { limit, document: true }),
        renderMetadataGroup("Task IDs", sourceValues(source, "task_ids"), { limit }),
        renderMetadataGroup("Heading Paths", sourceValues(source, "heading_paths"), { limit }),
      ].filter(Boolean).join("");
    }

    function statusClass(status) {
      if (["available", "ok", "done", "grounded"].includes(status)) return "ok";
      if (["degraded", "running", "pending", "missing_citations"].includes(status)) return "warn";
      if (["unavailable", "failed", "insufficient_context"].includes(status)) return "err";
      return "";
    }

    function saveScope() {
      state.userId = $("#scope-user").value.trim();
      state.sessionId = $("#scope-session").value.trim();
      localStorage.setItem("vidwise.user_id", state.userId);
      localStorage.setItem("vidwise.session_id", state.sessionId);
      updateScopeUI();
      refreshScopedData();
    }

    function updateScopeUI() {
      $("#scope-user").value = state.userId;
      $("#scope-session").value = state.sessionId;
      $("#scope-pill").textContent = state.userId ? `user:${state.userId}` : (state.sessionId ? `session:${compactId(state.sessionId)}` : "知识库范围未保存");
      $("#scope-pill").className = "pill" + (state.userId || state.sessionId ? " ok" : " warn");
      $("#source-pill").textContent = `${state.selectedSourceIds.size} sources`;
      $("#task-pill").textContent = state.activeTaskId ? `task:${compactId(state.activeTaskId)}` : "0 tasks";
      renderSelectedSources();
    }

    function scopeParams() {
      const params = new URLSearchParams();
      if (state.userId) params.set("user_id", state.userId);
      if (state.sessionId) params.set("session_id", state.sessionId);
      return params;
    }

    function effectiveKnowledgeScopeLabel() {
      if (state.userId) return `个人知识库 user:${state.userId}`;
      if (state.sessionId) return `会话知识库 session:${compactId(state.sessionId)}`;
      return "知识库范围未保存";
    }

    function defaultRetrievalText() {
      if (state.userId) return `当前检索 ${effectiveKnowledgeScopeLabel()} 的全部 source。`;
      if (state.sessionId) return `当前检索 ${effectiveKnowledgeScopeLabel()} 的全部 source。`;
      return "请先保存 User ID 或 Session ID。";
    }

    function emptySourceText() {
      if (state.userId) return `${effectiveKnowledgeScopeLabel()} 暂无 source。`;
      if (state.sessionId) return `${effectiveKnowledgeScopeLabel()} 暂无 source。`;
      return "请先保存 User ID 或 Session ID。";
    }

    function appendScopeToFormData(fd) {
      if (state.userId) fd.append("user_id", state.userId);
      if (state.sessionId) fd.append("session_id", state.sessionId);
    }

    function requireScope(target) {
      if (state.userId || state.sessionId) return true;
      target.textContent = "请先保存 User ID 或 Session ID。";
      target.style.color = "var(--danger)";
      return false;
    }

    function switchTab(tab) {
      state.tab = tab;
      $$(".tab").forEach((el) => el.classList.toggle("active", el.id === `tab-${tab}`));
      $$(".nav-item").forEach((el) => el.classList.toggle("active", el.dataset.nav === tab));
      $("#page-title").textContent = titles[tab] || "VidWise";
      if (tab === "sources") loadSources();
      if (tab === "tasks") loadTasks();
      if (tab === "chat") renderSelectedSources();
    }

    async function fetchJSON(url, options) {
      const resp = await fetch(url, options);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || data.message || `HTTP ${resp.status}`);
      return data;
    }

    async function loadRuntime() {
      try {
        const ready = await fetchJSON("/ready");
        $("#ready-dot").className = "health-dot " + (ready.ready ? "ok" : "err");
      } catch {
        $("#ready-dot").className = "health-dot err";
      }
      try {
        const health = await fetchJSON("/rag/health");
        setRuntimeChip("rag", health.rag, "RAG");
        const llmStatus = health.llm_status || (health.llm ? "available" : "unavailable");
        setRuntimeChip("llm", llmStatus, "LLM");
      } catch (err) {
        setRuntimeChip("rag", "unavailable", "RAG");
        setRuntimeChip("llm", "unavailable", "LLM");
      }
    }

    function setRuntimeChip(name, status, label) {
      $(`#${name}-dot`).className = `health-dot ${statusClass(status)}`;
      $(`#${name}-status`).textContent = `${label} ${status || "unknown"}`;
    }

    async function loadSessions() {
      const list = $("#session-list");
      try {
        const params = new URLSearchParams();
        if (state.userId) params.set("user_id", state.userId);
        const data = await fetchJSON("/chat/sessions" + (params.toString() ? `?${params}` : ""));
        list.innerHTML = "";
        (data.sessions || []).forEach((session) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "nav-item";
          btn.textContent = session.title || session.id;
          btn.title = session.id;
          btn.onclick = () => openSession(session.id);
          list.appendChild(btn);
        });
        if (!list.innerHTML) list.textContent = "暂无会话。";
      } catch {
        list.textContent = "会话存储不可用。";
      }
    }

    async function openSession(id) {
      try {
        const data = await fetchJSON(`/chat/session/${encodeURIComponent(id)}`);
        state.sessionId = data.id || id;
        localStorage.setItem("vidwise.session_id", state.sessionId);
        updateScopeUI();
        $("#messages").innerHTML = "";
        (data.messages || []).forEach((msg) => addMessage(msg.role, msg.content));
        switchTab("chat");
      } catch (err) {
        addMessage("assistant", `加载会话失败：${err.message}`);
      }
    }

    function newSession() {
      state.sessionId = "";
      localStorage.setItem("vidwise.session_id", "");
      updateScopeUI();
      $("#messages").innerHTML = "";
      addMessage("assistant", "新对话已就绪。");
      switchTab("chat");
    }

    function addMessage(role, text, metaHTML) {
      const box = document.createElement("div");
      box.className = `message ${role === "user" ? "user" : "assistant"}`;
      box.innerHTML = esc(text || "");
      if (metaHTML) box.innerHTML += metaHTML;
      $("#messages").appendChild(box);
      $("#messages").scrollTop = $("#messages").scrollHeight;
      return box;
    }

    function documentFilters() {
      const input = $("#document-filter");
      return splitCSV(input ? input.value : "");
    }

    function manualSourceIDs() {
      const input = $("#source-filter");
      return splitCSV(input ? input.value : "");
    }

    function chatSourceIDs() {
      return normalizeList([...Array.from(state.selectedSourceIds), ...manualSourceIDs()]);
    }

    async function sendChat() {
      const input = $("#chat-input");
      const query = input.value.trim();
      if (!query) return;
      addMessage("user", query);
      input.value = "";
      const placeholder = addMessage("assistant", "请求中...");
      $("#send-chat").disabled = true;
      try {
        const body = {
          query,
          user_id: state.userId,
          session_id: state.sessionId,
          source_ids: chatSourceIDs(),
          document_ids: documentFilters(),
        };
        const data = await fetchJSON("/chat/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (data.session_id) {
          state.sessionId = data.session_id;
          localStorage.setItem("vidwise.session_id", state.sessionId);
          updateScopeUI();
        }
        placeholder.innerHTML = esc(data.answer || "");
        placeholder.innerHTML += renderAnswerMeta(data);
        $("#rag-diagnostics").innerHTML = renderDiagnostics(data);
        await loadSessions();
      } catch (err) {
        placeholder.innerHTML = esc(`请求失败：${err.message}`);
      } finally {
        $("#send-chat").disabled = false;
      }
    }

    function renderAnswerMeta(data) {
      const status = data.rag_answer_status || data.rag_status || "not_applicable";
      const chunks = data.rag_context_chunks || [];
      let html = `<div class="meta">`;
      html += `<span class="pill ${statusClass(status)}">answer:${esc(status)}</span>`;
      html += `<span class="pill">retrieval:${esc(data.rag_status || "-")}</span>`;
      html += `<span class="pill">used:${data.rag_context_used_chunks || 0}</span>`;
      html += `</div>`;
      if (chunks.length) {
        html += `<details><summary>Prompt 片段 ${chunks.length}</summary>`;
        chunks.forEach((chunk) => {
          html += renderChunk(chunk, chunk.snippet_number || "");
        });
        html += `</details>`;
      }
      if ((data.chunks || []).length) {
        html += `<details><summary>检索结果 ${(data.chunks || []).length}</summary>`;
        (data.chunks || []).forEach((chunk, index) => {
          html += renderChunk(chunk, index + 1);
        });
        html += `</details>`;
      }
      return html;
    }

    function renderChunk(chunk, index) {
      const source = [chunk.source_name, chunk.heading_path, chunk.document_title, chunk.source_url].filter(Boolean).join(" / ");
      const text = String(chunk.text || "");
      return `<div class="chunk"><strong>${index ? "#" + esc(index) : "chunk"}</strong> <span class="muted">${esc(source)}</span><br>${esc(text.slice(0, 420))}${text.length > 420 ? "..." : ""}</div>`;
    }

    function renderDiagnostics(data) {
      const cited = (data.rag_answer_cited_snippets || []).join(", ") || "-";
      const invalid = (data.rag_answer_invalid_snippets || []).join(", ") || "-";
      const queries = (data.rag_queries || []).join(" | ") || data.rag_query || "-";
      return [
        `RAG: ${esc(data.rag_status || "-")}`,
        `answer: ${esc(data.rag_answer_status || "-")}`,
        `query: ${esc(queries)}`,
        `chunks: retrieved ${data.rag_chunk_count || 0}, used ${data.rag_context_used_chunks || 0}, duplicates ${data.rag_context_skipped_duplicates || 0}`,
        `citations: ${esc(cited)}, invalid ${esc(invalid)}`,
        `trace: ${esc(data.trace_id || "-")}`,
      ].join("<br>");
    }

    async function loadSources() {
      const status = $("#source-status");
      const table = $("#source-table");
      table.innerHTML = "";
      if (!requireScope(status)) return;
      status.textContent = "加载中...";
      try {
        const params = scopeParams();
        params.set("limit", "50");
        const data = await fetchJSON(`/rag/sources?${params}`);
        state.sources = data.sources || [];
        state.selectedSourceIds.forEach((id) => {
          if (!state.sources.some((source) => source.source_id === id)) state.selectedSourceIds.delete(id);
        });
        persistSelectedSources();
        renderSources();
        status.textContent = state.sources.length ? `已加载 ${state.sources.length} 个 source。` : emptySourceText();
        status.style.color = "";
      } catch (err) {
        status.textContent = err.message;
        status.style.color = "var(--danger)";
      }
    }

    function renderSources() {
      const table = $("#source-table");
      table.innerHTML = "";
      state.sources.forEach((source) => {
        const tr = document.createElement("tr");
        const checked = state.selectedSourceIds.has(source.source_id) ? "checked" : "";
        tr.innerHTML = `
          <td><input type="checkbox" data-source-check="${esc(source.source_id)}" ${checked}></td>
          <td class="source-cell">
            <div class="source-title">${esc(sourceLabel(source))}</div>
            <div class="id">${esc(source.source_id)}</div>
            <div class="source-meta">${esc(sourceMetaLine(source))}</div>
          </td>
          <td>${esc(source.content_type || "-")}</td>
          <td class="metadata-cell">${renderSourceMetadata(source)}</td>
          <td>${source.chunk_count || 0}</td>
          <td><div class="id">u:${esc(source.user_id || "-")}</div><div class="id">s:${esc(compactId(source.session_id || "-"))}</div></td>
          <td><button class="danger" type="button" data-delete-source="${esc(source.source_id)}">删除</button></td>
        `;
        table.appendChild(tr);
      });
      renderChatSourcePicker();
      renderSelectedSources();
      bindSourceSelectionInputs();
      bindSourceActionButtons();
    }

    function renderChatSourcePicker() {
      const picker = $("#chat-source-picker");
      if (!picker) return;
      if (!state.sources.length) {
        picker.innerHTML = `<div class="status-box">${esc(emptySourceText())}</div>`;
        return;
      }
      picker.innerHTML = state.sources.map((source) => {
        const checked = state.selectedSourceIds.has(source.source_id) ? "checked" : "";
        return `
          <label class="source-option">
            <input type="checkbox" data-chat-source-check="${esc(source.source_id)}" ${checked}>
            <span>
              <span class="source-title">${esc(sourceLabel(source))}</span>
              <span class="id">${esc(compactId(source.source_id))}</span>
              <span class="source-meta">${esc(sourceMetaLine(source))}</span>
              ${renderSourceMetadata(source, true)}
            </span>
          </label>
        `;
      }).join("");
    }

    function bindSourceSelectionInputs() {
      $$("[data-source-check], [data-chat-source-check]").forEach((input) => {
        input.onchange = () => {
          const sourceId = input.dataset.sourceCheck || input.dataset.chatSourceCheck;
          if (input.checked) state.selectedSourceIds.add(sourceId);
          else state.selectedSourceIds.delete(sourceId);
          persistSelectedSources();
          syncSourceCheckboxes();
          updateScopeUI();
        };
      });
    }

    function bindSourceActionButtons() {
      $$("[data-delete-source]").forEach((btn) => {
        btn.onclick = () => deleteSource(btn.dataset.deleteSource);
      });
      $$("[data-doc-filter]").forEach((btn) => {
        btn.onclick = () => toggleDocumentFilter(btn.dataset.docFilter);
      });
    }

    function syncSourceCheckboxes() {
      $$("[data-source-check], [data-chat-source-check]").forEach((input) => {
        const sourceId = input.dataset.sourceCheck || input.dataset.chatSourceCheck;
        input.checked = state.selectedSourceIds.has(sourceId);
      });
    }

    function syncDocumentChips() {
      const activeDocs = new Set(documentFilters());
      $$("[data-doc-filter]").forEach((btn) => {
        btn.classList.toggle("active", activeDocs.has(btn.dataset.docFilter));
      });
    }

    function toggleDocumentFilter(documentId) {
      const input = $("#document-filter");
      if (!input) return;
      const values = documentFilters();
      const next = values.includes(documentId) ? values.filter((value) => value !== documentId) : [...values, documentId];
      input.value = next.join(", ");
      updateScopeUI();
    }

    function persistSelectedSources() {
      localStorage.setItem("vidwise.selected_source_ids", JSON.stringify(Array.from(state.selectedSourceIds)));
    }

    function renderSelectedSources() {
      const box = $("#selected-source-list");
      if (!box) return;
      const selected = state.sources.filter((source) => state.selectedSourceIds.has(source.source_id));
      const selectedKnownIDs = new Set(selected.map((source) => source.source_id));
      const manualOnly = manualSourceIDs().filter((sourceID) => !selectedKnownIDs.has(sourceID));
      const docs = documentFilters();
      if (!selected.length && !manualOnly.length && !docs.length) {
        box.textContent = defaultRetrievalText();
      } else {
        const scopeHTML = `<div class="source-meta">${esc(effectiveKnowledgeScopeLabel())}</div>`;
        const knownHTML = selected.map((source) => `
          <div style="margin-bottom:10px;">
            <span class="pill ok">${esc(sourceLabel(source))}</span>
            <span class="id">${esc(source.source_id)}</span>
            ${renderSourceMetadata(source, true)}
          </div>
        `).join("");
        const manualHTML = manualOnly.length
          ? `<div class="chip-list">${manualOnly.map((sourceID) => `<span class="chip" title="${esc(sourceID)}">source:${esc(compactId(sourceID))}</span>`).join("")}</div>`
          : "";
        const docHTML = docs.length
          ? `<div class="source-meta">Document Filters</div><div class="chip-list">${docs.map((docID) => `<button class="chip active" type="button" title="${esc(docID)}" data-doc-filter="${esc(docID)}">doc:${esc(compactId(docID))}</button>`).join("")}</div>`
          : "";
        box.innerHTML = `${scopeHTML}${knownHTML}${manualHTML}${docHTML}`;
      }
      $("#source-pill").textContent = `${chatSourceIDs().length} sources`;
      syncDocumentChips();
      bindSourceActionButtons();
    }

    async function deleteSource(sourceId) {
      const status = $("#source-status");
      if (!requireScope(status)) return;
      try {
        const params = scopeParams();
        await fetchJSON(`/rag/source/${encodeURIComponent(sourceId)}?${params}`, { method: "DELETE" });
        state.selectedSourceIds.delete(sourceId);
        persistSelectedSources();
        await loadSources();
      } catch (err) {
        status.textContent = err.message;
        status.style.color = "var(--danger)";
      }
    }

    async function uploadSource(event) {
      event.preventDefault();
      const status = $("#upload-status");
      if (!requireScope(status)) return;
      const file = $("#upload-file").files[0];
      if (!file) {
        status.textContent = "请选择文件。";
        status.style.color = "var(--danger)";
        return;
      }
      status.textContent = "上传中...";
      status.style.color = "";
      try {
        const fd = new FormData();
        fd.append("file", file);
        appendScopeToFormData(fd);
        const data = await fetchJSON("/upload", { method: "POST", body: fd });
        status.innerHTML = `完成：${esc(data.filename)}<br>chunks: ${data.chunk_count || 0}<br>source_ids: ${esc((data.source_ids || []).join(", "))}`;
        status.style.color = "#bbf7d0";
        await loadSources();
      } catch (err) {
        status.textContent = err.message;
        status.style.color = "var(--danger)";
      }
    }

    async function startVideoTask(event) {
      event.preventDefault();
      const status = $("#video-status");
      const url = $("#video-url").value.trim();
      const name = $("#video-name").value.trim();
      if (!state.userId) {
        status.textContent = "视频任务需要 User ID。";
        status.style.color = "var(--danger)";
        return;
      }
      if (!url || !name) {
        status.textContent = "URL 和名称必填。";
        status.style.color = "var(--danger)";
        return;
      }
      status.textContent = "任务提交中...";
      status.style.color = "";
      try {
        const data = await fetchJSON("/video/process", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url,
            name,
            user_id: state.userId,
            session_id: state.sessionId,
            language: $("#video-language").value,
          }),
        });
        state.activeTaskId = data.task_id;
        if (data.session_id) {
          state.sessionId = data.session_id;
          localStorage.setItem("vidwise.session_id", state.sessionId);
        }
        updateScopeUI();
        status.innerHTML = `已提交 task: <span class="id">${esc(data.task_id)}</span><br>trace: <span class="id">${esc(data.trace_id || "-")}</span>`;
        pollTask(data.task_id);
        await loadTasks();
      } catch (err) {
        status.textContent = err.message;
        status.style.color = "var(--danger)";
      }
    }

    async function downloadExtract(event) {
      event.preventDefault();
      const status = $("#extract-status");
      const url = $("#extract-url").value.trim();
      const name = $("#extract-name").value.trim();
      const type = $("#extract-type").value;
      if (!url || !name) {
        status.textContent = "URL 和文件名必填。";
        status.style.color = "var(--danger)";
        return;
      }
      status.textContent = "下载中...";
      status.style.color = "";
      try {
        const params = scopeParams();
        const endpoint = "/extract" + (params.toString() ? `?${params}` : "");
        const resp = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, name, type }),
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.error || `HTTP ${resp.status}`);
        }
        const blob = await resp.blob();
        const disposition = resp.headers.get("content-disposition") || "";
        const match = disposition.match(/filename[^;=\n]*=['"]*([^'";\n]*)['"]*/i);
        const filename = match ? match[1] : `${name}.${type === "video" ? "mp4" : type === "audio" ? "mp3" : "txt"}`;
        downloadBlob(blob, filename);
        status.textContent = `已下载 ${filename}。`;
        status.style.color = "#bbf7d0";
        if (type === "text" || type === "summary") {
          await loadSources();
        }
      } catch (err) {
        status.textContent = err.message;
        status.style.color = "var(--danger)";
      }
    }

    async function pollTask(taskId) {
      clearTimeout(state.pollTimer);
      try {
        const task = await fetchJSON(`/task/${encodeURIComponent(taskId)}`);
        $("#active-task").innerHTML = renderTask(task);
        if (!["done", "failed"].includes(task.status)) {
          state.pollTimer = setTimeout(() => pollTask(taskId), 1800);
        } else {
          await loadTasks();
          await loadSources();
        }
      } catch (err) {
        $("#active-task").textContent = err.message;
      }
    }

    async function loadTasks() {
      const status = $("#task-status");
      const list = $("#task-list");
      list.innerHTML = "";
      if (!requireScope(status)) return;
      try {
        const params = scopeParams();
        params.set("limit", "20");
        const data = await fetchJSON(`/tasks?${params}`);
        const tasks = data.tasks || [];
        $("#task-pill").textContent = `${tasks.length} tasks`;
        status.textContent = tasks.length ? `已加载 ${tasks.length} 个任务。` : "当前范围下暂无任务。";
        list.innerHTML = tasks.map(renderTask).join("");
      } catch (err) {
        status.textContent = err.message;
        status.style.color = "var(--danger)";
      }
    }

    function renderTask(task) {
      const steps = (task.steps || []).map((step) => {
        return `<div class="step"><span>${esc(step.name)}</span><span class="pill ${statusClass(step.status)}">${esc(step.status)}</span>${step.error ? `<div class="id" style="grid-column:1 / -1;">${esc(step.error)}</div>` : ""}</div>`;
      }).join("");
      return `<div class="task">
        <div class="row" style="justify-content:space-between;">
          <strong>${esc(task.type || "task")}</strong>
          <span class="pill ${statusClass(task.status)}">${esc(task.status)}</span>
        </div>
        <div class="id">${esc(task.task_id || "")}</div>
        ${task.error ? `<div style="color:var(--danger);margin-top:6px;">${esc(task.error)}</div>` : ""}
        <div class="steps">${steps}</div>
      </div>`;
    }

    async function formatText(event) {
      event.preventDefault();
      const status = $("#format-status");
      const file = $("#format-file").files[0];
      if (!file) {
        status.textContent = "请选择文件。";
        status.style.color = "var(--danger)";
        return;
      }
      status.textContent = "格式化中...";
      status.style.color = "";
      try {
        const fd = new FormData();
        fd.append("file", file);
        const resp = await fetch("/format", { method: "POST", body: fd });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.error || `HTTP ${resp.status}`);
        }
        const blob = await resp.blob();
        downloadBlob(blob, "formatted.txt");
        status.textContent = "已下载 formatted.txt。";
        status.style.color = "#bbf7d0";
      } catch (err) {
        status.textContent = err.message;
        status.style.color = "var(--danger)";
      }
    }

    function downloadBlob(blob, filename) {
      const href = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = href;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(href);
    }

    async function refreshScopedData() {
      await Promise.allSettled([loadSessions(), loadSources(), loadTasks()]);
    }

    function bindEvents() {
      $$(".nav-item[data-nav]").forEach((btn) => btn.onclick = () => switchTab(btn.dataset.nav));
      $("#save-scope").onclick = saveScope;
      $("#new-session").onclick = newSession;
      $("#refresh-runtime").onclick = loadRuntime;
      $("#reload-sources").onclick = loadSources;
      $("#reload-chat-sources").onclick = loadSources;
      $("#clear-source-filter").onclick = () => {
        state.selectedSourceIds.clear();
        $("#source-filter").value = "";
        $("#document-filter").value = "";
        persistSelectedSources();
        renderSources();
        updateScopeUI();
      };
      $("#source-filter").addEventListener("input", updateScopeUI);
      $("#document-filter").addEventListener("input", updateScopeUI);
      $("#reload-tasks").onclick = loadTasks;
      $("#send-chat").onclick = sendChat;
      $("#chat-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendChat();
        }
      });
      $("#upload-form").addEventListener("submit", uploadSource);
      $("#video-form").addEventListener("submit", startVideoTask);
      $("#extract-form").addEventListener("submit", downloadExtract);
      $("#format-form").addEventListener("submit", formatText);
    }

    bindEvents();
    updateScopeUI();
    loadRuntime();
    refreshScopedData();
    setInterval(loadRuntime, 30000);
  </script>
</body>
</html>
