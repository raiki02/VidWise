server:
  addr: ":8080"
  read_header_timeout: "5s"
  read_timeout: "30s"
  # 0 keeps long-running download/transcription responses backward compatible.
  write_timeout: "0s"
  idle_timeout: "120s"
  shutdown_timeout: "10s"

download:
  # Optional path to yt-dlp cookies.txt file.
  cookies_path: ""

asr:
  # Gateway -> local ASR adapter service. Keep this local even when the adapter
  # itself calls a cloud ASR provider.
  base_url: "http://localhost:8001"
  timeout: "10m"
  language: "zh"
  model:
    # Local providers: whisper, faster-whisper
    # Cloud providers: aliyun, dashscope, xfyun, iflytek, baidu, baiducloud
    provider: "whisper"
    # Local: model path / HF model ID. Aliyun: qwen3-asr-flash.
    # XFYun/Baidu ignore this field and use their own ASR APIs.
    name: "./models/whisper-small"
    device: "auto"
    torch_dtype: "auto"
    compute_type: "default"
    cpu_threads: 0
    workers: 1
    # Used only when provider is aliyun/dashscope.
    api_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: ""
    api_key_env: "DASHSCOPE_API_KEY"
    api_timeout_seconds: 300
    # Qwen-ASR OpenAI-compatible local-file calls encode audio as base64.
    # Use OSS/file URL async transcription for larger production files.
    max_file_bytes: 7500000
    # Used only when provider is xfyun/iflytek.
    xfyun_api_base_url: "https://office-api-ist-dx.iflyaisol.com/v2"
    xfyun_app_id: ""
    xfyun_app_id_env: "XFYUN_APP_ID"
    xfyun_access_key_id: ""
    xfyun_access_key_id_env: "XFYUN_API_KEY"
    xfyun_access_key_secret: ""
    xfyun_access_key_secret_env: "XFYUN_API_SECRET"
    xfyun_language: "autodialect"
    xfyun_result_type: "transfer"
    xfyun_api_timeout_seconds: 300
    xfyun_poll_interval_seconds: 3
    xfyun_max_poll_seconds: 600
    xfyun_max_file_bytes: 500000000
    # 0 disables chunking. Set to 240-300 when free/trial quota rejects long
    # autodialect uploads but accepts short files.
    xfyun_chunk_seconds: 0
    xfyun_duration_check_disable: true
    # Used only when provider is baidu/baiducloud.
    # The backend uses Baidu short speech REST API, converts local audio to
    # 16 kHz mono WAV with ffmpeg, and submits <=60s chunks.
    baidu_token_url: "https://aip.baidubce.com/oauth/2.0/token"
    baidu_api_base_url: "https://vop.baidu.com"
    baidu_api_key: ""
    baidu_api_key_env: "BAIDU_ASR_API_KEY"
    baidu_secret_key: ""
    baidu_secret_key_env: "BAIDU_ASR_SECRET_KEY"
    baidu_cuid: "vidwise"
    # 1537 is the common Mandarin model. Change this for other Baidu dev_pid models.
    baidu_dev_pid: 1537
    baidu_rate: 16000
    baidu_channel: 1
    baidu_api_timeout_seconds: 60
    baidu_chunk_seconds: 55
    baidu_max_chunk_bytes: 10000000
  transcribe:
    beam_size: 5
    vad_filter: true
    initial_prompt: ""
    # Upper bound before Whisper's model-specific decoder length budget is applied.
    max_new_tokens: 448
    # Optional domain prompt is trimmed first so generation always has room.
    max_initial_prompt_tokens: 224
    vad:
      threshold: 0.3
      min_speech_duration_ms: 100
      min_silence_duration_ms: 500
      speech_pad_ms: 600
  stream:
    enabled: true
    sample_rate: 16000
    chunk_size: 1600
    max_buffer_seconds: 30
    vad:
      threshold: 0.5
      min_speech_duration_ms: 250
      min_silence_duration_ms: 200
      speech_pad_ms: 100
      max_speech_duration_s: 30

video_summary:
  base_url: "http://localhost:8002"
  timeout: "20m"
  model:
    name: "./models/marlin"
    provider: "huggingface"
    device: "auto"
    dtype: "bfloat16"
    compile: false
  summarize:
    max_new_tokens: 2048
    prompt: ""
    do_sample: false
    temperature: 1.0
    top_p: 1.0

llm:
  enabled: true
  fallback_to_raw_on_error: true
  provider: "openai"
  model: ""
  base_url: ""
  api_key: ""
  api_key_env: "OPENAI_API_KEY"
  timeout: "2m"
  temperature: 0.2
  # Leave unset for auto-detection. Set true for OpenAI-compatible beta/reasoning
  # models that reject temperature/top_p/penalty params.
  disable_sampling_params: true
  max_tokens: 512
  path: ""
  keep_alive: ""
  chunk_runes: 2000
  two_step: false
  step1_chunk_runes: 800
  step1_prompt:
    system: |
      你是中文文本纠错助手。
      任务：
        - 修正错别字
        - 繁体中文转简体中文
      禁止：
        - 改写句子
        - 调整段落
        - 增加或删除内容
      输出：
        - 仅返回纠正后的文本
    user_template: "{{text}}"
  prompt:
    system: |
      你是专业的中文转写稿编辑。你的任务是只对转写文本进行自然段划分和轻微格式整理。

      要求：
      1. 保留原文语义，不总结、不扩写、不改写事实。
      2. 修正明显的断句和空白、错别字问题。
      3. 按话题、语义停顿和上下文划分段落。
      4. 段落之间使用一个空行分隔。
      5. 不要添加标题、列表、Markdown 标记或解释。
    user_template: |
      请为下面的转写文本划分自然段，只返回处理后的正文：

      {{text}}

mysql:
  dsn: "video_extractor:password@tcp(localhost:3306)/video_extractor?parseTime=true"
  max_open: 10
  max_idle: 5

qdrant:
  host: "localhost"
  port: 6334
  api_key: ""
  use_tls: false
  collection: "transcript_chunks"
  vector_dim: 1024

rag:
  retrieval:
    # Vector candidates retrieved before optional reranking.
    search_top_k: 20
    # Final chunks sent back to chat/tool callers.
    top_k: 8
    # 0 disables score filtering. Raise for stricter vector relevance.
    min_score: 0
  context:
    # Maximum retrieved context runes packed into the LLM prompt.
    max_runes: 12000

search:
  # Enables the Eino web_search tool. Tool inputs stay limited to query/freshness;
  # providers, crawler, cache, rerank, and compression stay internal.
  enabled: true
  # Backward-compatible primary provider. `providers` below controls multi-source routing.
  provider: "mock"
  # Supported: mock, internal, bing, tavily, duckduckgo.
  providers: ["mock"]
  query_rewrite_provider: "mock" # mock or llm
  query_rewrite_max_queries: 3
  rerank_provider: "keyword" # keyword or embedding
  cache_provider: "memory" # memory or redis
  timeout: "10s"
  cache_ttl: "5m"
  max_cache_keys: 1024
  max_results: 10
  max_documents: 5
  max_content_runes: 1200
  max_total_runes: 6000
  max_response_bytes: 2097152
  max_concurrency: 4
  user_agent: "VidwiseSearchBot/0.1"
  allow_localhost: false
  # Reserved for future robots.txt policy enforcement.
  robots_policy: "respect"
  bing:
    enabled: false
    base_url: "https://api.bing.microsoft.com/v7.0/search"
    api_key: ""
    api_key_env: "BING_SEARCH_API_KEY"
    max_results: 10
  tavily:
    enabled: false
    base_url: "https://api.tavily.com/search"
    api_key: ""
    api_key_env: "TAVILY_API_KEY"
    max_results: 10
    search_depth: "basic"
  duckduckgo:
    enabled: false
    base_url: "https://duckduckgo.com/html/"
    max_results: 10
  internal:
    enabled: false
    search_top_k: 20
    top_k: 8
    min_score: 0
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    key_prefix: "vidwise:search:"
    timeout: "1s"

embedding:
  # Gateway -> local embedding adapter service. Keep this local even when the
  # adapter itself calls a cloud embedding provider.
  base_url: "http://localhost:8003"
  # local/sentence-transformers loads local or HF models; aliyun/dashscope calls
  # Alibaba Cloud Model Studio; siliconflow calls SiliconFlow embeddings.
  provider: "local"
  # Local: model shortcut (qwen, bge, bge-large) or local path.
  # Aliyun: text-embedding-v4.
  # SiliconFlow: qwen shortcut maps to Qwen/Qwen3-Embedding-0.6B; you may also
  # set Qwen/Qwen3-Embedding-4B, Qwen/Qwen3-Embedding-8B,
  # Qwen/Qwen3-VL-Embedding-8B, BAAI/bge-m3, etc.
  # Download first:
  #   huggingface-cli download Qwen/Qwen3-Embedding-0.6B --local-dir ./models/qwen3-embedding
  #   huggingface-cli download BAAI/bge-m3 --local-dir ./models/bge-m3
  model: "qwen"
  device: "auto"
  timeout: "2m"
  # Used only for cloud providers. Leave blank for provider defaults:
  #   aliyun qwen3-rerank -> https://dashscope.aliyuncs.com/compatible-mode/v1
  #   aliyun gte-rerank-v2 -> https://dashscope.aliyuncs.com/api/v1
  #   siliconflow     -> https://api.siliconflow.cn/v1
  api_base_url: ""
  api_key: ""
  # Leave blank for provider defaults: DASHSCOPE_API_KEY or SILICONFLOW_API_KEY.
  api_key_env: ""
  api_timeout_seconds: 120
  # Output dimension for providers/models that support a dimensions parameter.
  # The SiliconFlow adapter only sends this for Qwen3 embedding models; it is
  # omitted automatically for BGE and other SiliconFlow models.
  dimensions: 1024
  batch_size: 10

rerank:
  # Gateway -> local embedding/rerank adapter service.
  base_url: "http://localhost:8003"
  # local/cross-encoder loads a dedicated sentence-transformers CrossEncoder.
  # Cloud providers: aliyun/dashscope or siliconflow.
  # Set provider to embedding/cosine only if you intentionally want the old
  # embedding-similarity fallback instead of a dedicated reranker.
  provider: "local"
  # Local: bge-reranker shortcut maps to BAAI/bge-reranker-v2-m3, or use a local path.
  # Aliyun: qwen3-rerank or gte-rerank-v2.
  # SiliconFlow: BAAI/bge-reranker-v2-m3, netease-youdao/bce-reranker-base_v1, etc.
  # Download local model first if using provider=local:
  #   huggingface-cli download BAAI/bge-reranker-v2-m3 --local-dir ./models/bge-reranker-v2-m3
  model: "BAAI/bge-reranker-v2-m3"
  device: "auto"
  top_k: 3
  timeout: "1m"
  # Used only for cloud providers. Leave blank for provider defaults:
  #   aliyun/dashscope -> https://dashscope.aliyuncs.com/compatible-mode/v1
  #   siliconflow     -> https://api.siliconflow.cn/v1
  # For Alibaba Cloud qwen3-rerank workspace endpoints, set the full workspace
  # compatible API base URL, e.g. https://{workspace}.cn-beijing.maas.aliyuncs.com/compatible-api/v1
  api_base_url: ""
  api_key: ""
  # Leave blank for provider defaults: DASHSCOPE_API_KEY or SILICONFLOW_API_KEY.
  api_key_env: ""
  api_timeout_seconds: 120
  # Optional reranker-specific instruction. Sent as instruct for Aliyun qwen3-rerank
  # and instruction for SiliconFlow.
  instruction: ""
  return_documents: false
  max_chunks_per_doc: 0
  overlap_tokens: 0

mcp:
  enabled: true
  addr: ":8082"
  mode: "sse"

upload:
  chunk_runes: 1024
  overlap_runes: 128
  max_file_bytes: 10485760 # 10 MB

task:
  # Maximum async task records retained by the gateway.
  max_tracked: 1000
  # Maximum concurrently running video_process jobs. 0 means unlimited.
  max_concurrent_video: 0
  # Terminal task statuses are retained for this duration before pruning.
  retain_for: "24h"
  # Local JSON fallback used when mysql.dsn is empty. When MySQL is configured,
  # task list and transcript outputs are restored from the tasks tables instead.
  storage_path: ".vidwise/tasks.json"
